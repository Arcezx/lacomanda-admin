<div class="pagina-header">
  <h1>Categorías</h1>
  <button class="boton-nuevo" (click)="abrirNuevo()">+ Nueva categoría</button>
</div>

<p class="error-mensaje" *ngIf="error">{{ error }}</p>

<div class="tabla-wrapper" *ngIf="!cargando">
  <table>
    <thead>
      <tr>
        <th>Orden</th>
        <th>Foto</th>
        <th>Nombre (ES)</th>
        <th>Nombre (VAL)</th>
        <th>Nombre (EN)</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let categoria of categorias">
        <td>{{ categoria.orden }}</td>
        <td><img [src]="categoria.foto" [alt]="categoria.nombreEs" class="foto-mini" /></td>
        <td>{{ categoria.nombreEs }}</td>
        <td>{{ categoria.nombreVal }}</td>
        <td>{{ categoria.nombreEn }}</td>
        <td class="acciones">
          <button class="boton-editar" (click)="abrirEditar(categoria)">Editar</button>
          <button class="boton-eliminar" (click)="eliminar(categoria)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-overlay" *ngIf="modalAbierto" (click)="cerrarModal()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <h2>{{ editando ? 'Editar categoría' : 'Nueva categoría' }}</h2>

    <label>Nombre (Español)</label>
    <input type="text" [(ngModel)]="formNombreEs" />

    <label>Nombre (Valenciano)</label>
    <input type="text" [(ngModel)]="formNombreVal" />

    <label>Nombre (Inglés)</label>
    <input type="text" [(ngModel)]="formNombreEn" />

    <label>Orden</label>
    <input type="number" [(ngModel)]="formOrden" />

    <label>URL de la foto</label>
    <input type="text" [(ngModel)]="formFoto" placeholder="http://localhost:8090/imagenes/categorias/..." />

    <div class="modal-acciones">
      <button class="boton-cancelar" (click)="cerrarModal()">Cancelar</button>
      <button class="boton-guardar" (click)="guardar()">Guardar</button>
    </div>
  </div>
</div>
