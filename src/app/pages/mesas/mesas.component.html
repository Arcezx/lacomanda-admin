<div class="pagina-header">
  <h1>Mesas</h1>
  <button class="boton-nuevo" (click)="abrirNuevo()">+ Nueva mesa</button>
</div>

<p class="error-mensaje" *ngIf="error">{{ error }}</p>

<div class="tabla-wrapper" *ngIf="!cargando">
  <table>
    <thead>
      <tr>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Código QR</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let mesa of mesas">
        <td>{{ mesa.numero }}</td>
        <td>{{ mesa.capacidad }} personas</td>
        <td>
          <span class="badge" [class.badge-si]="!mesa.ocupada" [class.badge-no]="mesa.ocupada">
            {{ mesa.ocupada ? 'Ocupada' : 'Libre' }}
          </span>
        </td>
        <td class="qr-code">{{ mesa.qrCode }}</td>
        <td class="acciones">
          <button class="boton-editar" (click)="abrirEditar(mesa)">Editar</button>
          <button class="boton-eliminar" (click)="eliminar(mesa)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-overlay" *ngIf="modalAbierto" (click)="cerrarModal()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <h2>{{ editando ? 'Editar mesa' : 'Nueva mesa' }}</h2>

    <label>Número de mesa</label>
    <input type="number" [(ngModel)]="formNumero" />

    <label>Capacidad (personas)</label>
    <input type="number" [(ngModel)]="formCapacidad" />

    <div class="modal-acciones">
      <button class="boton-cancelar" (click)="cerrarModal()">Cancelar</button>
      <button class="boton-guardar" (click)="guardar()">Guardar</button>
    </div>
  </div>
</div>
